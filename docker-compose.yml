services:
  mongodb:
    image: mongo:7.0
    container_name: medical-chat-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medical-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-chat-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=medical_chat
      - PATIENT_DATA_DIR=data/patients
      - AI_SUGGESTIONS_ENABLED=true
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medical-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-chat-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - medical-net

volumes:
  mongodb-data:

networks:
  medical-net:
    driver: bridge
